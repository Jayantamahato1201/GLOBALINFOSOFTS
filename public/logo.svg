<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- 1. Top-Left Magenta / Pink Petal Gradient -->
    <linearGradient id="pinkGrad" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#D81B60" />
    </linearGradient>

    <!-- 2. Bottom-Right Fresh Lime Green Petal Gradient -->
    <linearGradient id="greenGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#65A30D" />
      <stop offset="50%" stop-color="#76BA1B" />
      <stop offset="100%" stop-color="#8CD623" />
    </linearGradient>

    <!-- 3. Top-Right Royal & Sky Blue Droplet Base Gradient -->
    <linearGradient id="blueBaseGrad" x1="30%" y1="0%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#0047BA" />
      <stop offset="30%" stop-color="#0066D6" />
      <stop offset="70%" stop-color="#0095FF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <!-- 4. Blue Droplet Glass Gloss Highlight Gradient -->
    <linearGradient id="blueGlossGrad" x1="10%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#0099FF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="72%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#70D6FF" stop-opacity="0.4" />
    </linearGradient>

    <!-- 5. Bottom-Left Teal & Cyan Droplet Base Gradient -->
    <linearGradient id="cyanBaseGrad" x1="70%" y1="100%" x2="20%" y2="20%">
      <stop offset="0%" stop-color="#005B60" />
      <stop offset="30%" stop-color="#007E8E" />
      <stop offset="70%" stop-color="#00A8B8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- 6. Cyan Bubble Specular Shine -->
    <radialGradient id="cyanBubbleGloss" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <g id="global-infosoft-logo">
    <!-- 1. Top-Left Magenta / Pink Crescent Petal -->
    <path
      d="M 217.2 16.3
         A 236 236 0 0 0 49.9 124.9
         C 95 100, 160 52, 217.2 16.3 Z"
      fill="url(#pinkGrad)"
    />

    <!-- 2. Bottom-Right Fresh Green Leaf Petal -->
    <path
      d="M 282.8 483.7
         A 236 236 0 0 0 450.1 375.1
         C 405 400, 340 448, 282.8 483.7 Z"
      fill="url(#greenGrad)"
    />

    <!-- 3. Top-Right Royal & Sky Blue Droplet -->
    <path
      d="M 229.4 14.9
         A 236 236 0 0 1 465.6 346.0
         C 435 375, 365 365, 305 310
         C 280 280, 262 255, 255 235
         C 245 185, 235 100, 229.4 14.9 Z"
      fill="url(#blueBaseGrad)"
    />

    <!-- 3b. Blue Droplet Glass Gloss Highlight -->
    <path
      d="M 275 172
         C 340 182, 410 182, 473 172
         A 236 236 0 0 1 465.6 346.0
         C 435 375, 365 365, 305 310
         C 280 280, 262 255, 255 235
         C 265 210, 270 190, 275 172 Z"
      fill="url(#blueGlossGrad)"
    />

    <!-- 3c. Blue Specular Crescent Glow -->
    <path
      d="M 320 330
         C 370 355, 420 335, 445 285
         C 430 325, 380 345, 320 330 Z"
      fill="#FFFFFF"
      opacity="0.6"
    />

    <!-- 4. Bottom-Left Cyan Droplet -->
    <path
      d="M 270.6 485.1
         A 236 236 0 0 1 34.4 154.0
         C 65 125, 135 135, 195 190
         C 220 220, 238 245, 245 265
         C 255 315, 265 400, 270.6 485.1 Z"
      fill="url(#cyanBaseGrad)"
    />

    <!-- 4b. Cyan Droplet Glass Bubble Shine -->
    <ellipse
      cx="78"
      cy="220"
      rx="50"
      ry="42"
      transform="rotate(-30 78 220)"
      fill="url(#cyanBubbleGloss)"
    />
  </g>
</svg>